<div class="modal-bg">
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="modal-box">
    
    <div class="modal-header">
      <h3>{{ userData?.uid ? 'Chỉnh Sửa Tài Khoản' : 'Thêm Tài Khoản Mới' }}</h3>
      <button type="button" class="btn-close" (click)="close.emit()">✕</button>
    </div>

    <div class="inputs-area">
      <div class="form-group">
        <label>Tài khoản <span class="text-danger">*</span></label>
        <input type="text" formControlName="username" [class.is-invalid]="userForm.get('username')?.invalid && userForm.get('username')?.touched">
        <div class="error-text" *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched">
          <span *ngIf="userForm.get('username')?.hasError('required')">Vui lòng nhập tài khoản.</span>
        </div>
      </div>

      <div class="form-group">
        <label>Tên hiển thị <span class="text-danger">*</span></label>
        <input type="text" formControlName="displayName" [class.is-invalid]="userForm.get('displayName')?.invalid && userForm.get('displayName')?.touched">
        <div class="error-text" *ngIf="userForm.get('displayName')?.invalid && userForm.get('displayName')?.touched">
          <span *ngIf="userForm.get('displayName')?.hasError('required')">Vui lòng nhập họ và tên.</span>
          <span *ngIf="userForm.get('displayName')?.hasError('maxlength')">Họ tên không được vượt quá 100 ký tự.</span>
        </div>
      </div>

      <div class="form-group">
        <label>Email <span class="text-danger">*</span></label>
        <input type="email" formControlName="email" [class.is-invalid]="userForm.get('email')?.invalid && userForm.get('email')?.touched">
        <div class="error-text" *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
          <span *ngIf="userForm.get('email')?.hasError('required')">Vui lòng nhập địa chỉ Email.</span>
          <span *ngIf="userForm.get('email')?.hasError('email')">Email không hợp lệ.</span>
        </div>
      </div>

      <div class="form-group">
        <label>Điểm thưởng </label>
        <input type="number" formControlName="creatorPoint" min =0>
      </div>

      <div class="form-group">
        <label>
          Mật khẩu <span *ngIf="!userData?.uid" class="text-danger">*</span>
        </label>
        <input type="password" formControlName="password" 
               [placeholder]="userData?.uid ? 'Bỏ trống nếu không muốn đổi mật khẩu' : 'Nhập mật khẩu...'"
               [class.is-invalid]="userForm.get('password')?.invalid && userForm.get('password')?.touched">
               <div class="error-text" *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched">
          <span *ngIf="userForm.get('password')?.hasError('required')">Vui lòng nhập mật khẩu.</span>
          <span *ngIf="userForm.get('password')?.hasError('minlength')">Mật khẩu mới phải có ít nhất 6 ký tự.</span>
        </div>
      </div>

      <div class="form-group row-group">
        <div class="col">
          <label>Chức vụ</label>
          <select formControlName="roleId">
            <option value="1">Admin</option>
            <option value="2">Tác giả</option>
            <option value="3">Độc giả</option>
          </select>
        </div>
        
        <div class="col">
          <label>Trạng thái</label>
          <select formControlName="status">
            <option value="Active">Hoạt động</option>
            <option value="Banned">Bị khóa</option>
          </select>
        </div>
      </div>
    </div>

    <div class="buttons-area">
      <button type="button" class="btn-cancel" (click)="close.emit()">Hủy</button>
      <button type="submit" class="btn-submit">{{ userData?.uid ? 'Lưu Thay Đổi' : 'Tạo Mới' }}</button>
    </div>

  </form>
</div>
