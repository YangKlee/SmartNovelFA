<div class="modal-overlay" (click)="onClose()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3>{{ isEditMode ? 'Sửa Thể Loại' : 'Thêm Thể Loại' }}</h3>
            <button class="btn-close" (click)="onClose()">&times;</button>
        </div>

        <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group" *ngIf="isEditMode">
                <label>Mã Thể Loại</label>
                <input type="text" formControlName="categoryId" readonly class="readonly-input">
            </div>

            <div class="form-group">
                <label>Tên Thể Loại <span class="text-danger">*</span></label>
                <input type="text" formControlName="name" placeholder="Nhập tên thể loại...">
                <div class="error-msg" *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
                    Vui lòng nhập tên thể loại.
                </div>
            </div>

            <div class="form-group">
                <label>Mô tả</label>
                <textarea formControlName="description" rows="3" placeholder="Nhập mô tả (không bắt buộc)..."></textarea>
            </div>

            <div class="form-group">
                <label>Trạng Thái</label>
                <select formControlName="status">
                    <option value="ACTIVE">Hiển thị</option>
                    <option value="HIDDEN">Đang ẩn</option>
                </select>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" (click)="onClose()">Hủy</button>
                <button type="submit" class="btn-submit">Lưu Lại</button>
            </div>
        </form>
    </div>
</div>
