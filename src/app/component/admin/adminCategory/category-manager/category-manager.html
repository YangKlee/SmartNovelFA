<div class="admin-container">
    <div class="header-bar">
        <h2>Quản Lý Thể Loại</h2>
        <button class="btn-create" (click)="openCreate()">+ Thêm Thể Loại</button>
    </div>

    <div class="filter-bar">
        <input type="text" placeholder="Tìm theo tên..." [(ngModel)]="keyword" (keyup.enter)="loadCategories(true)">

        <select [(ngModel)]="status" (change)="loadCategories(true)">
            <option value="">-- Tất cả trạng thái --</option>
            <option value="ACTIVE">Hiển thị</option>
            <option value="Hidden">Đang ẩn</option>
        </select>

        <button class="btn-filter" (click)="loadCategories(true)">Tìm Kiếm</button>
    </div>

    <app-category-list 
        [categories]="categories" 
        (edit)="openEdit($event)" 
        (delete)="deleteCategory($event)">
    </app-category-list>

    <app-category-edit 
        *ngIf="showForm" 
        [categoryData]="selectedCategory" 
        (close)="showForm = false" 
        (refresh)="loadCategories()">
    </app-category-edit>

    <div class="pagination" *ngIf="totalPages > 0">
        <button [disabled]="page === 1" (click)="prevPage()">« Trước</button>
        <span>Trang {{ page }} / {{ totalPages }}</span> 
        <button [disabled]="page === totalPages" (click)="nextPage()">Sau »</button>
    </div>
    
    <div class="total-records" *ngIf="totalRecords > 0">
        Tổng số: {{ totalRecords }} thể loại
    </div>
</div>
