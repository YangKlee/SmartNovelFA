<h1>Đăng nhập</h1>\
<form [formGroup]="loginForm" (ngSubmit)="doLogin()" action="">
    
    <input type="text" formControlName="txtUsername" placeholder="Enter username...">
    <input type="password" formControlName="txtPassword" placeholder="Enter password...">
    <input type="submit" value="Đăng nhập">
</form>
