<div class="popup-overlay">
  <div class="create-novel-container">
    <button [routerLink]="['/dashboard/author/novel-manager']" class="btn-close-popup"><i class="bi bi-x"></i></button>
    <div class="form-header">
      <h2>{{ novelDataEdit ? 'Cập Nhật Truyện' : 'Tạo Truyện Mới' }}</h2>
    </div>

    <form [formGroup]="novelForm" (ngSubmit)="onSubmit()" class="novel-form">
      <div class="form-layout">
        <!-- Left side: Uploads -->
        <div class="left-panel">
          <!-- Cover Upload -->
          <div class="form-group">
            <label>Ảnh bìa truyện</label>
            <div class="upload-area" (click)="coverInput.click()">
              <input type="file" #coverInput (change)="onCoverSelected($event)" accept="image/*" hidden />
              <div class="preview-container" *ngIf="coverPreview; else coverPlaceholder">
                <img [src]="coverPreview" alt="Cover Preview" class="cover-preview" />
              </div>
              <ng-template #coverPlaceholder>
                <div class="upload-placeholder">
                  <i class="bi bi-cloud-upload"></i>
                  <p>Tải ảnh bìa lên</p>
                </div>
              </ng-template>
            </div>
          </div>

          <!-- Banner Upload -->
          <div class="form-group mt-4">
            <label>Ảnh banner truyện</label>
            <div class="upload-area banner-area" (click)="bannerInput.click()">
              <input type="file" #bannerInput (change)="onBannerSelected($event)" accept="image/*" hidden />
              <div class="preview-container" *ngIf="bannerPreview; else bannerPlaceholder">
                <img [src]="bannerPreview" alt="Banner Preview" class="banner-preview" />
              </div>
              <ng-template #bannerPlaceholder>
                <div class="upload-placeholder">
                  <i class="bi bi-cloud-upload"></i>
                  <p>Tải ảnh banner lên</p>
                </div>
              </ng-template>
            </div>
          </div>
        </div>

        <!-- Right side: Inputs -->
        <div class="right-panel">
          <!-- Title -->
          <div class="form-group">
            <label>Tiêu đề (Title) <span class="required">*</span></label>
            <input type="text" class="form-control" formControlName="title" placeholder="Nhập tiêu đề truyện..." />
            <div *ngIf="novelForm.get('title')?.invalid && novelForm.get('title')?.touched" class="text-danger mt-1">
              <small>Tiêu đề là bắt buộc và tối đa 255 ký tự.</small>
            </div>
          </div>

          <!-- Description -->
          <div class="form-group mt-3">
            <label>Mô tả (Description)</label>
            <textarea class="form-control" formControlName="description" rows="5"
              placeholder="Nhập mô tả truyện..."></textarea>
          </div>

          <!-- Age Rating -->
          <div class="form-group mt-3">
            <label>Độ tuổi (Age Rating) <span class="required">*</span></label>
            <div class="range-slider-container">
              <input type="range" class="custom-range" min="6" max="18" formControlName="ageRating" />
              <span class="age-value">{{ novelForm.get('ageRating')?.value }}+</span>
            </div>
          </div>

          <!-- Genres -->
          <div class="form-group mt-3">
            <label>Thể loại (Genres)</label>
            <div class="genres-checkbox-list"
              style="display: flex; flex-wrap: wrap; gap: 15px; max-height: 200px; overflow-y: auto; padding: 15px; border: 1px solid #ced4da; border-radius: 6px; background-color: #fff;">
              <div class="form-check" *ngFor="let genre of genreList">
                <input class="form-check-input" type="checkbox" [value]="genre.categoryId"
                  [id]="'genre-' + genre.categoryId" [checked]="isGenreChecked(genre.categoryId)"
                  (change)="onGenreChange($event, genre.categoryId)">
                <label class="form-check-label" [for]="'genre-' + genre.categoryId"
                  style="cursor: pointer; user-select: none;">
                  {{ genre.name }}
                </label>
              </div>
              <div *ngIf="genreList.length === 0" class="text-muted small w-100 text-center">
                Đang cập nhật danh sách thể loại...
              </div>
            </div>
          </div>

          <!-- Status -->
          <div class="form-group mt-3">
            <label>Trạng thái (Status) <span class="required">*</span></label>
            <select class="custom-select" formControlName="status">
              <option value="Public">Public (Công khai)</option>
              <option value="Draft">Draft (Bản nháp)</option>
            </select>
            <div *ngIf="novelForm.get('status')?.invalid && novelForm.get('status')?.touched" class="text-danger mt-1">
              <small>Trạng thái là bắt buộc.</small>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="form-actions mt-4">
            <button type="submit" class="btn btn-primary btn-submit">
              <i class="bi bi-save"></i> {{ novelDataEdit ? 'Cập Nhật' : 'Lưu Truyện' }}
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
