<div class="modify-info-container">
    <div class="form-wrapper">
        <h2 class="form-title">ĐỔI MẬT KHẨU</h2>
        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="custom-form">

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Mật khẩu hiện tại</mat-label>
                <input matInput type="password" formControlName="oldPassword" placeholder="Nhập mật khẩu hiện tại">
                <mat-error *ngIf="passwordForm.get('oldPassword')?.hasError('required')">
                    Mật khẩu hiện tại không được để trống
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Mật khẩu mới</mat-label>
                <input matInput type="password" formControlName="newPassword" placeholder="Nhập mật khẩu mới">
                <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('required')">
                    Mật khẩu mới không được để trống
                </mat-error>
                <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('minlength')">
                    Mật khẩu mới phải có ít nhất 6 ký tự
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Xác nhận mật khẩu mới</mat-label>
                <input matInput type="password" formControlName="confirmPassword" placeholder="Nhập lại mật khẩu mới">
                <mat-error *ngIf="passwordForm.get('confirmPassword')?.hasError('required')">
                    Xác nhận mật khẩu không được để trống
                </mat-error>
                <mat-error *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched">
                    Mật khẩu xác nhận không khớp
                </mat-error>
            </mat-form-field>

            <div class="action-btn-group">
                <button mat-raised-button type="button" class="btn-cancel" routerLink="../">Hủy</button>
                <button mat-raised-button type="submit" class="btn-submit">Cập Nhật</button>
            </div>

        </form>
    </div>
</div>
