<div class="search-wrapper" [class.active]="showSearch">
  <div class="search-trigger" *ngIf="!showSearch" (click)="toggleSearch()">
    <i class="bi bi-search"></i>
    <span>Tìm kiếm...</span>
  </div>

  <div class="search-box" *ngIf="showSearch">
    <i class="bi bi-search search-inside-icon"></i>
    <input
      type="text"
      placeholder="Nhập tên truyện cần tìm..."
      [(ngModel)]="searchKeyword"
      (input)="searchNovel()"
      focusOnShow
      autocomplete="off"
    />
    <i class="bi bi-x-lg close-icon" (click)="toggleSearch()"></i>
  </div>

  <div class="search-result-dropdown" *ngIf="showSearch && searchKeyword.trim() !== ''">
    <div class="result-header">Kết quả lọc cho "{{ searchKeyword }}"</div>
    
    <div class="result-scroll-area">
      <div class="novel-item" *ngFor="let novel of filteredNovels" [routerLink]="['/novel', novel.novelId]" (click)="toggleSearch()">
        <div class="novel-info">
          <i class="bi bi-book text-muted me-2"></i>
          <span class="novel-title">{{ novel.title }}</span>
        </div>
        <i class="bi bi-chevron-right arrow-icon"></i>
      </div>

      <div class="novel-item no-result" *ngIf="filteredNovels.length === 0">
        <i class="bi bi-exclamation-circle-fill animated-bounce"></i>
        <span>Trong kho trống trơn, mời bạn tìm lại</span>
      </div>
    </div>
  </div>
</div>
