<header class="main-header">

    <a href="#" class="logo">Logo</a>

    <nav class="nav-links">
        <a href="#" class="nav-item">
            <i class="bi bi-house"></i> Trang chủ
        </a>

        <a routerLink="/filter" class="nav-item">
            <i class="bi bi-list-ul"></i> Thể loại <i class="bi bi-chevron-down ms-icon"></i>
        </a>

        <a href="#" class="nav-item">
            <i class="bi bi-bar-chart"></i> Bảng xếp hạng <i class="bi bi-chevron-down ms-icon"></i>
        </a>

       <a href="#" class="nav-item">
            <i class="bi bi-search"></i> Tìm truyện
        </a>
        <a routerLink="/filter" class="nav-item">
            <i class="bi bi-people"></i> Tác giả
        </a>
    </nav>

    <div class="auth-buttons" *ngIf="(user$ | async) == null">
        <button class="btn btn-login" (click)="logibBtn()">
           Đăng nhập
        </button>
        <button class="btn btn-register">
            Đăng ký
        </button>
    </div>

    <button matButton [matMenuTriggerFor]="menu" class="user-info" *ngIf="user$ | async as user">
        <i class="bi bi-person-circle"></i> {{user.username}}
    </button>

    <mat-menu #menu="matMenu">
        <button (click)="doLogout()" mat-menu-item>
            Đăng xuất
        </button>
    </mat-menu>

</header>

<main class="main-content">
    <router-outlet></router-outlet>
</main>
<app-search></app-search>
