<header class="main-header">

    <a href="#" class="logo">Logo</a>

    <nav class="nav-links">
        <a href="#" class="nav-item">
            <i class="bi bi-house"></i> Trang chủ
        </a>

        <a routerLink="/filter" class="nav-item">
            <i class="bi bi-list-ul"></i> Thể loại <i class="bi bi-chevron-down ms-icon"></i>
        </a>

        <a href="#" class="nav-item">
            <i class="bi bi-bar-chart"></i> Bảng xếp hạng <i class="bi bi-chevron-down ms-icon"></i>
        </a>

        <div class="search-wrapper" [class.active]="showSearch">
            
            <div class="search-trigger" *ngIf="!showSearch" (click)="toggleSearch()">
                <i class="bi bi-search"></i>
                <span>Tìm truyện</span>
            </div>

            <div class="search-box" *ngIf="showSearch">
                <i class="bi bi-search"></i>
                <input 
                    type="text" 
                    placeholder="Tìm truyện..." 
                    [(ngModel)]="searchKeyword"
                    (input)="searchNovel()" 
                />
                <i class="bi bi-x-lg close-icon" (click)="toggleSearch()"></i>
            </div>

            <div class="search-result" *ngIf="showSearch && searchKeyword.trim() !== ''">
                
                <ng-content *ngIf="novels.length > 0">
                    <div class="novel-item" *ngFor="let novel of novels">
                        {{ novel.title }}
                    </div>
                </ng-content>

                <div class="novel-item no-result" *ngIf="novels.length === 0" style="color: #ff6b6b; cursor: default;">
                    <i class="bi bi-exclamation-circle"></i> Không có truyện nào được tìm thấy
                </div>

            </div>
        </div>

        <a routerLink="/filter" class="nav-item">
            <i class="bi bi-people"></i> Tác giả
        </a>
    </nav>

    <div class="auth-buttons" *ngIf="(user$ | async) == null">
        <button class="btn btn-login" (click)="logibBtn()">
           Đăng nhập
        </button>
        <button class="btn btn-register">
            Đăng ký
        </button>
    </div>

    <button matButton [matMenuTriggerFor]="menu" class="user-info" *ngIf="user$ | async as user">
        <i class="bi bi-person-circle"></i> {{user.username}}
    </button>

    <mat-menu #menu="matMenu">
        <button (click)="doLogout()" mat-menu-item>
            Đăng xuất
        </button>
    </mat-menu>

</header>

<main class="main-content">
    <router-outlet></router-outlet>
</main>
